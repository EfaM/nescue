name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
      runs-on: ubuntu-latest

      services:
        mysql:
          image: mysql:8.4
          env:
            MYSQL_DATABASE: nescue
            MYSQL_USER: nescue
            MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping -h localhost"
            --health-intervall=10s
            --health-timeout=10s
            --health-retries=10

      steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: JDK 25 (Temurin)
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: '25'
            cache: maven

        - name: Maven Rechte
          run: chmod +x mvnw

        - name: Testen und Build
          env:
            DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          run: ./mvnw -B verify