name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: JDK 25 (Temurin)
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: '25'
            cache: maven

        - name: Maven Rechte
          run: chmod +x mvnw

        - name: Testen und Build
          run: ./mvnw -B verify