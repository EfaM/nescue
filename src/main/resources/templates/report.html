<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">

<head th:replace="~{basicLayout :: head('Sichtung melden')}"></head>

<body>

<header th:replace="~{basicLayout :: header}"></header>

<main class="container mb-4 p-3">
    <h2> Du hast ein Geisternetz entdeckt?</h2>
    <div th:if="${param.success}" class="alert alert-success fade show" role="status">
        Deine Meldung wurde übermittelt. Danke für deinen Beitrag zur Rettung der Meere!
    </div>
    <form th:action="@{/report}" th:object="${reportForm}" method="post">
        <fieldset>
            <legend class="form-label fs-6">Geschätzte Größe</legend>
            <div class="form-check" th:each=" sizeItem : ${sizeItems}">
                <input class="form-check-input" type="radio" th:field="*{size}" th:value="${sizeItem}" required>
                <label class="form-check-label" th:for="${#ids.prev('size')}" th:text="#{sizeItem.__${sizeItem}__}"></label>
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></div>
        </fieldset>
        <div class="input-group mt-4">
            <span class="input-group-text" id="latitude-description">Breitengrad</span>
            <input type="number" class="form-control" th:field="*{latitude}" min="-90" max="90" step="any" placeholder="von -90 bis +90" aria-label="breitengrad" aria-describedby="latitude-description">
        </div>
        <div class="text-danger small" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}"></div>
        <div class="input-group mt-2">
            <span class="input-group-text" id="longitude-description">Längengrad</span>
            <input type="number" class="form-control" th:field="*{longitude}" min="-180" max="180" step="any" placeholder="von -180 bis +180" aria-label="längengrad" aria-describedby="longitude-description">
        </div>
        <div class="text-danger small" th:if="${#fields.hasErrors('longitude')}" th:errors="*{longitude}"></div>
        <div>
            <button type="button" class="btn btn-outline-secondary mt-4 mb-2" data-bs-toggle="collapse" data-bs-target="#personForm" aria-expanded="false" aria-controls="personForm">
                Stehst du für Rückfragen zur Verfügung?
            </button>
        </div>
        <div class="text-danger small my-4" th:if="${#fields.hasErrors('completeContactDataInForm')}" th:errors="*{completeContactDataInForm}"></div>
        <div class="collapse" id="personForm" th:classappend="${#fields.hasErrors('completeContactDataInForm')} ? 'show'">
            <div class="mb-2">
                <label for="firstname" class="form-label">Vorname*</label>
                <input type="text" class="form-control contactForm" th:field="*{firstname}" placeholder="Vorname">
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}"></div>
            <div class="mb-2">
                <label for="lastname" class="form-label">Nachname*</label>
                <input type="text" class="form-control contactForm" th:field="*{lastname}" placeholder="Nachname">
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}"></div>
            <div class="mb-2">
                <label for="phoneNumber" class="form-label">Telefonnummer*</label>
                <input type="tel" class="form-control contactForm" th:field="*{phoneNumber}" placeholder="Telefonnummer mit + beginnend.">
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
            <p class="form-text">* Pflichtfelder</p>
        </div>
        <button type="submit" class="my-4 btn btn-primary">Netzsichtung abschicken</button>
    </form>
</main>

<nav th:replace="~{basicLayout :: navigation('report')}"></nav>

<th:block th:replace="~{basicLayout :: scripts}"></th:block>
</body>
</html>
