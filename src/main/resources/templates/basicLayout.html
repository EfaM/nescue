<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="icon" th:href="@{/img/favicon.ico}">
</head>
<body>

<header th:fragment="header" class="border-bottom">
    <nav class="navbar bg-body">
        <div class="navbar bg-body">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                    <img th:src="@{/img/nescue_logo.png}" alt="Nescue Logo" width="52" height="52">
                    <span>Nescue</span>
                </a>
            </div>
        </div>
    </nav>
</header>

<nav th:fragment="navigation(active)" class="fixed-bottom bg-body border-top py-2">
    <ul class="nav nav-pills p-2">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">Startseite</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'report'} ? 'active'" th:href="@{/report}">Sichtung melden</a>
        </li>
    </ul>
</nav>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</th:block>

</body>
</html>
